    const DATA_URL = "data.json";
let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

async function loadWishlist() {
  try {
    const response = await fetch(DATA_URL);
    const homes = await response.json(); // Natively parses the JSON array

    const selected = homes.filter((home) =>
      wishlist.includes(String(home.id))
    );

    render(selected);
  } catch (error) {
    console.error("Error loading wishlist items:", error);
  }
}

function render(list) {
  const container = document.getElementById("wishlistContainer");
  const emptyMsg = document.getElementById("emptyMessage");
  
  container.innerHTML = "";

  if (list.length === 0) {
    if (emptyMsg) emptyMsg.classList.remove("d-none");
    return;
  }

  if (emptyMsg) emptyMsg.classList.add("d-none");

  container.innerHTML = list.map((home) => `
    <div class="col-md-4 mb-4">
      <div class="card">
        <img src="${home.image}" class="card-img-top" alt="${home.name}">
        <div class="card-body">
          <h5>${home.name}</h5>
          <p>${home.location}</p>
          <p class="price">₹${home.price}</p>
          <div class="d-grid gap-2">
            <a href="details.html?id=${home.id}" class="btn btn-success">
              View Details
            </a>
            <button class="btn btn-danger remove-btn" onclick="removeItem('${home.id}')">
              Remove
            </button>
          </div>
        </div>
      </div>
    </div>
  `).join("");
}

function removeItem(id) {
  wishlist = wishlist.filter((item) => item != id);
  localStorage.setItem("wishlist", JSON.stringify(wishlist));
  loadWishlist();
}

loadWishlist();
